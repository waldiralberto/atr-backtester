<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATR Trade Backtester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }
      input, button, select { font-family: 'Outfit', sans-serif; }
      input:focus { outline: none !important; }
      input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.5; filter: invert(0.5); }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #334; border-radius: 3px; }

      .strategy-card:hover { transform: translateY(-6px) !important; }
      .trade-row:hover .btn-del { opacity: 1 !important; }
      .log-btn:hover { filter: brightness(1.12); transform: translateY(-1px) !important; }
      .pill:hover { transform: translateY(-1px) !important; }
      .stat-card:hover { transform: translateY(-3px) !important; }
      .theme-toggle:hover { transform: scale(1.08); }

      /* Equity curve draw animation */
      @keyframes drawLine {
        from { stroke-dashoffset: var(--path-len, 9999); }
        to   { stroke-dashoffset: 0; }
      }
      .eq-path {
        stroke-dasharray: var(--path-len, 9999);
        stroke-dashoffset: var(--path-len, 9999);
        animation: drawLine 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fadeUp 0.5s ease forwards; }

      /* Glow pulse for "TARGET REACHED" */
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 8px rgba(0,230,118,0.4); }
        50% { box-shadow: 0 0 22px rgba(0,230,118,0.8); }
      }
      .glow-green { animation: glowPulse 2s ease infinite; }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
