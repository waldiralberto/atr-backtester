<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATR Trade Backtester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
      input, button, select { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      input:focus { outline: none !important; border-color: #00bfff !important; box-shadow: 0 0 0 3px rgba(0,191,255,0.13) !important; }
      input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.5; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #eef0f6; }
      ::-webkit-scrollbar-thumb { background: #c8d2e2; border-radius: 3px; }
      .strategy-card:hover { transform: translateY(-5px) !important; box-shadow: 0 16px 40px rgba(0,0,0,0.1) !important; }
      .trade-row:hover { background: #eaecf5 !important; }
      .trade-row:hover .btn-del { opacity: 1 !important; }
      .stat-card:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 24px rgba(0,0,0,0.07) !important; }
      .log-btn:hover { filter: brightness(1.08); transform: translateY(-1px) !important; box-shadow: 0 8px 24px rgba(0,128,255,0.36) !important; }
      .pill:hover { opacity: 0.82; transform: translateY(-1px) !important; }
      @keyframes slideIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
